[package]
name = "hybridfilexfer-receiver"
version = "1.2.0"
edition = "2021"
description = "Receiver for HybridFileXfer / 多轨快传, with a GUI"

[lib]
name = "hfx_receiver"
path = "src/lib.rs"

# 图形界面版（Slint + fluent 样式，Win11 观感）
[[bin]]
name = "HybridFileXfer-Receiver"
path = "src/bin/gui_slint.rs"

# 命令行版（无界面，便于自动化/开机后台运行）
[[bin]]
name = "HybridFileXfer-Receiver-cli"
path = "src/main.rs"

[dependencies]
slint = "1.18"
# 更新检测：用 native-tls（走 Windows 证书库），这样系统代理/镜像证书也能校验通过
ureq = { version = "2", features = ["json", "native-certs"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
